<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission & Registration - Orbit IT Solutions</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .admission-container {
      max-width: 650px;
      margin: 20px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .admission-container h2 {
      text-align: center;
      color: #1a237e;
      margin-top: 0;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-group {
      flex: 1;
      margin-bottom: 15px;
    }
    .form-group.full-width {
      width: 100%;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus, 
    .form-group select:focus {
      border-color: #1a237e;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #1a237e;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 5px;
      margin: 25px 0 15px 0;
    }
    .installments-grid {
      display: flex;
      gap: 10px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .terms-box {
      background: #fff8e1;
      border: 1px solid #ffe0b2;
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      color: #5d4037;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    .checkbox-group input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #1a237e;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-btn:hover {
      background: #0d1b60;
    }
  </style>
</head>
<body>

  <div class="admission-container">
    <h2>Orbit IT Solutions</h2>
    <div class="subtitle">Mehdipatnam, Hyderabad | Official Student Registration Form</div>
    
    <form id="orbitRegistrationForm" action="mailto:orbitcomputersmehdipatnam@gmail.com" method="POST" enctype="text/plain" onsubmit="prepareEmailSubject(event)">
      
      <div class="section-title">1. Personal Information</div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="studentName">Student Full Name *</label>
          <input type="text" id="studentName" name="Student Name" required placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label for="fatherName">Father's Name *</label>
          <input type="text" id="fatherName" name="Father Name" required placeholder="Enter father's name">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="contactNumber">Contact Number *</label>
          <input type="tel" id="contactNumber" name="Contact Number" pattern="[0-9]{10}" required placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label for="whatsappNumber">WhatsApp Number *</label>
          <input type="tel" id="whatsappNumber" name="WhatsApp Number" pattern="[0-9]{10}" required placeholder="10-digit WhatsApp number">
        </div>
      </div>

      <div class="form-group full-width">
        <label for="emailId">Email Address *</label>
        <input type="email" id="emailId" name="Email ID" required placeholder="student@example.com">
      </div>

      <div class="section-title">2. Course Selection & Source</div>

      <div class="form-row">
        <div class="form-group">
          <label for="coursePreferred">Course Preferred (Optional)</label>
          <select id="coursePreferred" name="Course Preferred">
            <option value="">-- Select Course (Optional) --</option>
            <option value="DSA (45 Days - ₹15,000)">DSA (Data Structures & Algorithms - 45 Days, ₹15,000)</option>
            <option value="Digital Marketing (45 Days - ₹18,200)">Digital Marketing (45 Days, ₹18,200)</option>
            <option value="Stock Market & Trading (30 Days - ₹22,200)">Stock Market & Trading (30 Days, ₹22,200)</option>
            <option value="Software Testing (Manual & Playwright Automation)">Software Testing (Manual & Playwright Automation)</option>
            <option value="Python Programming & Data Science">Python Programming & Data Science</option>
            <option value="Java Full Stack Development">Java Full Stack Development</option>
            <option value="C & C++ Programming">C & C++ Programming</option>
            <option value="Web Development (HTML, CSS, JS, React)">Web Development (HTML, CSS, JS, React)</option>
            <option value="Accounts Training (Tally Prime / GST / Accounting)">Accounts Training (Tally Prime / GST / Accounting)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="customCourse">Customized Course (If Any)</label>
          <input type="text" id="customCourse" name="Custom Course Module" placeholder="Enter custom subject requirements">
        </div>
      </div>

      <div class="form-group full-width">
        <label for="referenceSource">How did you come to know about Orbit IT Solutions?</label>
        <select id="referenceSource" name="Reference Source">
          <option value="Google Search / Website">Google Search / Website</option>
          <option value="Social Media (Instagram / YouTube)">Social Media (Instagram / YouTube)</option>
          <option value="Friend / Word of Mouth">Friend / Word of Mouth</option>
          <option value="Walk-in / Direct Visit">Walk-in / Direct Visit</option>
          <option value="Flyer / Pamphlet">Flyer / Pamphlet</option>
        </select>
      </div>

      <div class="section-title">3. Fee Details & Installments (For 6 Months / Extended Courses)</div>

      <div class="form-row">
        <div class="form-group">
          <label for="totalFees">Total Fees (₹) *</label>
          <input type="text" id="totalFees" name="Total Fees" required placeholder="e.g., 25000">
        </div>
        <div class="form-group">
          <label for="feesPaid">Fees Paid (₹) *</label>
          <input type="text" id="feesPaid" name="Fees Paid" required placeholder="e.g., 10000">
        </div>
      </div>

      <label style="font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; color: #333;">Installments Breakdown (3 Blocks):</label>
      <div class="installments-grid">
        <div class="form-group" style="margin-bottom:0;">
          <label style="font-size: 12px;">Installment 1 (₹ / Date)</label>
          <input type="text" name="Installment 1" placeholder="Amount & Date">
        </div>
