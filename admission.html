<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission & Registration - Orbit IT Solutions</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .admission-container {
      max-width: 650px;
      margin: 20px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .admission-container h2 {
      text-align: center;
      color: #1a237e;
      margin-top: 0;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-group {
      flex: 1;
      margin-bottom: 15px;
    }
    .form-group.full-width {
      width: 100%;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus, 
    .form-group select:focus {
      border-color: #1a237e;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #1a237e;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 5px;
      margin: 25px 0 15px 0;
    }
    .installments-grid {
      display: flex;
      gap: 10px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .terms-box {
      background: #fff8e1;
      border: 1px solid #ffe0b2;
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      color: #5d4037;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    .checkbox-group input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #1a237e;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-btn:hover {
      background: #0d1b60;
    }
  </style>
</head>
<body>

  <div class="admission-container">
    <h2>Orbit IT Solutions</h2>
    <div class="subtitle">Mehdipatnam, Hyderabad | Official Student Registration Form</div>
    
    <!-- Standard Form Submission directly routing to your email -->
    <form action="https://formsubmit.co/orbitcomputersmehdipatnam@gmail.com" method="POST">

      <input type="hidden" name="_captcha" value="false">

      <input type="hidden" name="_subject" value="New Student Admission Inquiry - Orbit IT Solutions">

          <label for="studentName">Student Full Name</label>
          <input type="text" id="studentName" name="Student Name" placeholder="Enter full name">

        <div class="form-group">
          <label for="fatherName">Father's Name</label>
          <input type="text" id="fatherName" name="Father Name" placeholder="Enter father's name">
        </div>
      </div>

        <div class="form-group">

          <input type="tel" id="whatsappNumber" name="WhatsApp Number" placeholder="WhatsApp number">

      </div>

        <label for="emailId">Email Address</label>

      </div>

              <option value="Digital Marketing (45 Days - ₹18,200)">Digital Marketing (45 Days, ₹18,200)</option>

            </optgroup>

            </optgroup>
            <optgroup label="Programming & Development">
              <option value="Python Programming">Python Programming</option>
              <option value="Java Programming">Java Programming</option>
              <option value="C & C++ Programming">C & C++ Programming</option>
              <option value="Web Development (HTML, CSS, JS, React)">Web Development (HTML, CSS, JS, React)</option>
              <option value="Java Full Stack Development">Java Full Stack Development</option>
              <option value="Python Full Stack Development">Python Full Stack Development</option>
            </optgroup>
            <optgroup label="Data Science & Analytics">
              <option value="Data Analytics (Excel, SQL, Power BI)">Data Analytics (Excel, SQL, Power BI)</option>
              <option value="Data Science & Machine Learning">Data Science & Machine Learning</option>
            </optgroup>
            <optgroup label="Cloud & Systems">
              <option value="AWS Cloud Computing">AWS Cloud Computing</option>
              <option value="DevOps Engineering">DevOps Engineering</option>
              <option value="Linux Administration">Linux Administration</option>
            </optgroup>
            <optgroup label="Accounts & Financial Courses">
              <option value="Tally Prime with GST">Tally Prime with GST</option>
              <option value="Advanced Excel & MIS Reporting">Advanced Excel & MIS Reporting</option>
              <option value="Complete Accounting Suite">Complete Accounting Suite</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group">
          <label for="customCourse">Customized Course (If Any)</label>
          <input type="text" id="customCourse" name="Custom Course Module" placeholder="Enter custom subject requirements">
        </div>
      </div>

      <div class="form-group full-width">
        <label for="referenceSource">How did you come to know about Orbit IT Solutions?</label>
        <select id="referenceSource" name="Reference Source">
          <option value="Not Specified">-- Select Source --</option>
          <option value="Google Search / Website">Google Search / Website</option>
          <option value="Social Media (Instagram / YouTube)">Social Media (Instagram / YouTube)</option>
          <option value="Friend / Word of Mouth">Friend / Word of Mouth</option>
          <option value="Walk-in / Direct Visit">Walk
