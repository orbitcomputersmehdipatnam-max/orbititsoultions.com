<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Admission - Orbit IT Solutions</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .admission-container {
      max-width: 500px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .admission-container h2 {
      text-align: center;
      color: #1a237e;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus, 
    .form-group select:focus {
      border-color: #1a237e;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #25d366;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-btn:hover {
      background: #1eb954;
    }
  </style>
</head>
<body>

  <div class="admission-container">
    <h2>Online Admission Form</h2>
    
    <form id="orbitAdmissionForm" onsubmit="submitAdmissionToWhatsApp(event)">
      
      <div class="form-group">
        <label for="admName">Student Full Name *</label>
        <input type="text" id="admName" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="admPhone">WhatsApp Mobile Number *</label>
        <input type="tel" id="admPhone" pattern="[0-9]{10}" required placeholder="10-digit mobile number">
      </div>

      <div class="form-group">
        <label for="admCourse">Select Course *</label>
        <select id="admCourse" required>
          <option value="">-- Choose Course --</option>
          <option value="DSA (45 Days)">DSA (45 Days - ₹15,000)</option>
          <option value="Digital Marketing (45 Days)">Digital Marketing (45 Days - ₹18,200)</option>
          <option value="Stock Market & Trading (30 Days)">Stock Market & Trading (30 Days - ₹22,200)</option>
          <option value="Software Testing (Manual & Playwright)">Software Testing (Manual & Playwright)</option>
          <option value="Accounts Training">Accounts Training</option>
        </select>
      </div>

      <div class="form-group">
        <label for="admMode">Preferred Training Mode</label>
        <select id="admMode">
          <option value="Offline Classroom (Mehdipatnam)">Offline Classroom (Mehdipatnam)</option>
          <option value="Online Live Classes">Online Live Classes</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">
        Submit Admission via WhatsApp 📲
      </button>

    </form>
  </div>
